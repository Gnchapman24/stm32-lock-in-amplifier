name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  sim:
    name: Python model (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]   # oldest supported (pyproject) and a current one
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: sim/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit + end-to-end tests
        run: pytest -q

      # The vectors are the firmware's contract. Regenerating them must give
      # byte-identical files; a diff means the model changed without a re-export.
      - name: Test vectors are reproducible
        run: |
          python -m experiments.export_vectors
          git diff --exit-code -- vectors/

  firmware:
    name: Firmware (arm-none-eabi-gcc 14.2) + host C tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0             # git describe needs tags/history for FW_VERSION

      # Pinned to the version used locally (D37).
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.2.Rel1'

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build target firmware
        run: |
          cmake --preset target
          cmake --build --preset target

      - name: Host C unit tests
        run: |
          cmake --preset host
          cmake --build --preset host
          ctest --preset host

      - uses: actions/upload-artifact@v4
        with:
          name: lockin-firmware
          path: |
            firmware/build/target/lockin.elf
            firmware/build/target/lockin.hex
            firmware/build/target/lockin.map
